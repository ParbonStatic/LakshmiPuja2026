<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Shree Lakshmi Puja Diya &amp; Lotus">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="65%" stop-color="#4A0E17" />
      <stop offset="100%" stop-color="#240810" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F48FB1" />
      <stop offset="45%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>
    <linearGradient id="flameOuter" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="55%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFF59D" />
    </linearGradient>
    <radialGradient id="flameHalo" cx="50%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Medallion Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2.5 2.5" opacity="0.75" />

  <!-- Ambient Flame Glow -->
  <circle cx="32" cy="22" r="16" fill="url(#flameHalo)" />

  <!-- Sacred Lotus Petals (Base) -->
  <g fill="url(#lotusGrad)" stroke="#FFD54F" stroke-width="0.5" stroke-linejoin="round">
    <!-- Outer Left & Right Petals -->
    <path d="M32 49 C20 49 11 43 10 36 C16 35 24 39 32 46 Z" />
    <path d="M32 49 C44 49 53 43 54 36 C48 35 40 39 32 46 Z" />
    <!-- Mid Left & Right Petals -->
    <path d="M32 47 C22 45 16 37 18 29 C23 31 28 36 32 44 Z" />
    <path d="M32 47 C42 45 48 37 46 29 C41 31 36 36 32 44 Z" />
  </g>

  <!-- Golden Clay Diya Bowl -->
  <path d="M15 36 Q32 54 49 36 Q32 42 15 36 Z" fill="url(#goldGrad)" stroke="#FFF8E1" stroke-width="0.6" />
  <ellipse cx="32" cy="36.8" rx="15" ry="2.5" fill="#5D1916" opacity="0.65" />

  <!-- Diya Flame -->
  <path d="M32 10 C27 18 25 25 27.5 31 C29 34 35 34 36.5 31 C39 25 37 18 32 10 Z" fill="url(#flameOuter)" />
  <path d="M32 16 C29.5 21 28.8 26 30.2 30 C31 31.8 33 31.8 33.8 30 C35.2 26 34.5 21 32 16 Z" fill="#FFFDE7" />

  <!-- Decorative Tilak Dot -->
  <circle cx="32" cy="43.5" r="1.4" fill="#E91E63" stroke="#FFF8E1" stroke-width="0.4" />
</svg>

